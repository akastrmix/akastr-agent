name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

concurrency:
  group: agent-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate immutable release input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; published assets are immutable" >&2
            exit 1
          fi

      - name: Require successful main verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_commit=$(git rev-parse HEAD)
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$candidate_commit\" and .status == \"completed\") | .conclusion" \
            | head -n 1)
          test "$conclusion" = success

      - name: Build release assets
        shell: bash
        run: scripts/build-release.sh "$RELEASE_TAG" dist

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort | paste -sd ' ' -)" = "akastr-agent-linux-amd64 install.sh"
          test -x dist/akastr-agent-linux-amd64
          test -x dist/install.sh
          file dist/akastr-agent-linux-amd64 | grep -Eq 'ELF 64-bit.*x86-64.*statically linked'
          test "$(dist/akastr-agent-linux-amd64 version)" = "$RELEASE_TAG"
          bash -n dist/install.sh
          ! LC_ALL=C grep -q $'\r' dist/install.sh
          set +e
          installer_usage=$(dist/install.sh 2>&1)
          installer_status=$?
          set -e
          test "$installer_status" -eq 1
          grep -Fq 'usage: install.sh' <<<"$installer_usage"
          ! grep -Eq '@AKASTR_AGENT_(VERSION|BINARY_SHA256)@' dist/install.sh
          grep -Fq "curl --fail --show-error --silent --location" dist/install.sh
          grep -Fq -- "--proto '=https' --proto-redir '=https' --retry 3" dist/install.sh
          grep -Fq -- '--output "$destination" "$url"' dist/install.sh
          ! grep -Fq "wget " dist/install.sh

      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/akastr-agent-linux-amd64 \
            dist/install.sh \
            --verify-tag \
            --title "Akastr Agent $RELEASE_TAG" \
            --generate-notes \
            --latest
