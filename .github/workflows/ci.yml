name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-go.sh
          for script in scripts/*.sh; do sh -n "$script"; done
          sh scripts/verify-ipquality-source.sh

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          release_root=$(mktemp -d)
          trap 'rm -rf -- "$release_root"' EXIT
          scripts/build-release.sh v0.0.0 "$release_root/release"
          test "$("$release_root/release/akastr-agent-linux-amd64" version)" = v0.0.0
          sh -n "$release_root/release/install.sh"
          # An unsubstituted pin would publish an installer that can never succeed.
          ! grep -Eq '@AKASTR_AGENT_(VERSION|BINARY_SHA256)@' "$release_root/release/install.sh"

      - name: Verify Debian runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          for version in 12 13; do
            docker run --rm \
              --volume "$PWD:/source:ro" \
              --workdir /source \
              "debian:${version}-slim" \
              sh scripts/verify-debian-runtime-dependencies.sh
          done
